<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso | Clínica</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth"><div class="card">
<div class="abas" role="tablist" aria-label="Tipo de acesso">
  <button type="button" id="perfil-medico" aria-selected="true">Sou médico</button>
  <button type="button" id="perfil-paciente" aria-selected="false">Sou paciente</button>
</div>
<h1 id="titulo" style="font-size:1.4rem"></h1><p id="subtitulo" class="mt"></p>
<div id="aviso" class="mensagem erro" hidden></div>
<div id="mensagem" class="mensagem" hidden role="alert"></div>
<div class="abas"><button type="button" id="aba-login" data-view="login" aria-selected="true">Já tenho cadastro</button>
<button type="button" id="aba-cadastro" data-view="cadastro" aria-selected="false">Quero me cadastrar</button></div>

<form id="form-login">
  <label for="login-email">E-mail</label><input id="login-email" type="email" autocomplete="email">
  <label for="login-senha">Senha</label><div class="senha"><input id="login-senha" type="password" autocomplete="current-password"><button type="button" class="ver-senha" data-alvo="login-senha">Mostrar</button></div>
  <p><button type="button" class="link" data-view="recuperar">Esqueci minha senha</button></p>
  <button type="submit" style="width:100%">Entrar</button>
</form>

<form id="form-cadastro" hidden>
  <label for="cad-nome">Nome completo</label><input id="cad-nome" autocomplete="name">
  <div class="so-medico">
    <div class="g3"><div><label for="cad-crm">CRM</label><input id="cad-crm" inputmode="numeric" maxlength="8"></div>
    <div><label for="cad-uf">UF</label><input id="cad-uf" maxlength="2" style="text-transform:uppercase"></div>
    <div><label for="cad-tel">Telefone</label><input id="cad-tel" type="tel"></div></div>
    <label for="cad-esp">Especialidade</label><input id="cad-esp" placeholder="Ex.: Nutrologia, Endocrinologia">
  </div>
  <label for="cad-email">E-mail</label><input id="cad-email" type="email" autocomplete="email">
  <p class="mt so-paciente" hidden>Use o mesmo e-mail que seu médico cadastrou para você.</p>
  <label for="cad-senha">Senha</label><div class="senha"><input id="cad-senha" type="password" autocomplete="new-password"><button type="button" class="ver-senha" data-alvo="cad-senha">Mostrar</button></div>
  <label for="cad-senha2">Repita a senha</label><div class="senha"><input id="cad-senha2" type="password" autocomplete="new-password"><button type="button" class="ver-senha" data-alvo="cad-senha2">Mostrar</button></div>
  <button type="submit" style="width:100%;margin-top:1rem">Criar conta</button>
</form>

<form id="form-recuperar" hidden>
  <label for="rec-email">E-mail</label><input id="rec-email" type="email">
  <button type="submit" style="width:100%;margin-top:1rem">Enviar link</button>
  <p><button type="button" class="link" data-view="login">Voltar ao login</button></p>
</form>
</div></main>
<script>
(function(){var av=document.getElementById("aviso");
function m(t){av.textContent=t;av.hidden=false}
if(location.protocol==="file:")m("Esta página foi aberta direto do arquivo, então os botões não funcionam. Abra por um servidor (ex.: Live Server do VS Code ou Firebase Hosting).");
window.addEventListener("error",function(e){m("Erro ao carregar o sistema: "+(e.message||"arquivo não encontrado")+". Confira se firebase-config.js está na mesma pasta e abra o console (F12).")},true);})();
</script>
<script type="module" src="js/auth.js"></script></body></html>
